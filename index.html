<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Football Players</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <header class="site-header">
      <nav class="navbar">
        <!-- Logo -->
        <a href="#" class="navbar-logo"> FOOTBALL<span>DB</span> </a>

        <!-- Navigation links -->
        <div class="navbar-links">
          <a href="#" class="nav-link active"> Players </a>

          <a href="#" class="nav-link"> Teams </a>

          <a href="#" class="nav-link"> Rankings </a>
        </div>

        <!-- Sorting -->
        <div class="sort-container">
          <label for="player-sort" class="sort-label"> Sort by </label>

          <div class="select-wrapper">
            <select id="player-sort" class="player-sort">
              <option value="default">Default</option>

              <option value="rating">Rating</option>

              <option value="age">Age</option>

              <option value="country">Country</option>
            </select>

            <span class="dropdown-icon"> ▼ </span>
          </div>
        </div>
      </nav>
    </header>

    <main class="main-content">
      <section class="players-section">
        <div class="section-heading">
          <div>
            <p class="section-eyebrow">PLAYER DATABASE</p>

            <h1 class="section-title">Players</h1>
          </div>

          <p class="player-count">8 Players</p>
        </div>

        <div class="players-grid" id="players-grid">
            <!-- code will be injected from javascript  -->
        </div>
      </section>
    </main>



    <script src="./app.js"></script>
  </body>
</html>
